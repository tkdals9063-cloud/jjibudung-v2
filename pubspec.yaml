name: jjibudung_v2
description: Industrial posture care app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  sensors_plus: ^7.0.0

  vibration: ^3.2.0

  shared_preferences: ^2.5.3

  wakelock_plus: ^1.4.0

  permission_handler: ^12.0.1

  package_info_plus: ^9.0.0

  android_intent_plus: ^6.0.0

  proximity_sensor: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/stretch/
    - assets/exercise/
    - assets/icon/