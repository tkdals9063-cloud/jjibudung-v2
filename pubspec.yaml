name: jjibudung_v2
description: Industrial posture care app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  marquee: ^2.3.0
  cupertino_icons: ^1.0.9
  sensors_plus: ^7.0.0
  vibration: ^3.2.0
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.4.0
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.0
  android_intent_plus: ^6.0.0
  proximity_sensor: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/stretch/
    - assets/exercise/
    - assets/characters/
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#725AC1"
  image: "assets/icon/splash_foreground_clean.png"

  android_12:
    color: "#725AC1"
    image: "assets/icon/splash_foreground_clean.png"
